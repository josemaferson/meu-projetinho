<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Alunos</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h2>Inscriçao de aluno ESA </h2>
        <button><a href="login.html">login</a></button>
        

        <div class="formulario">
            <input type="text" id="nome" placeholder="Nome do Aluno">

            <input type="number" id="idade" placeholder="Idade">

            <input type="text" id="curso" placeholder="Curso">

            <button id="btnSalvar" onclick="salvarAluno()">Cadastrar</button>
        </div>

        <h3>Lista de Alunos Matriculados</h3>

        <table border="1">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Idade</th>
                    <th>Curso</th>
                    <th>Ação</th>
                </tr>
            </thead>

            <tbody id="tabelaAlunos"></tbody>
        </table>

    </div>

    <script src="admin.js"></script>

</body>
</html>
